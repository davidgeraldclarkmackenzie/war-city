const yellowEcon    = new Economy('yellow', grid);
const units         = new UnitManager();
const blueTraffic   = new TrafficManager('blue',   grid, blueEcon);
const yellowTraffic = new TrafficManager('yellow', grid, yellowEcon);
const ai            = new AI(grid, yellowEcon, units);
const canvas        = document.getElementById('canvas');
const renderer      = new Renderer3D(canvas, grid);

// ─── Extended systems ─────────────────────────────────────────────────────────
const blueTrain     = new WarTrain('blue');
const yellowTrain   = new WarTrain('yellow');
const bridgeTrucks  = new BridgeTruckManager();
const blueWaste     = new WasteManager('blue',   grid, blueEcon);
const yellowWaste   = new WasteManager('yellow', grid, yellowEcon);

const yellowFreight = new FreightManager('yellow', grid, yellowEcon);

// ─── Game state ───────────────────────────────────────────────────────────────
let elapsedSec     = 0;
let peacetime      = true;
let activeTool     = 'select';
let lastTime       = null;
let aiTrainDeployed = false;
let aiTruckTimer   = 0;

// Barracks spawn
let barracksTimer = 0;
const BARRACKS_INTERVAL = 8;
const BARRACKS_COST     = 500;

// Zone development
const ZONE_DEVELOP_TIME = [0, 30, 90, 240]; // seconds to reach each level

// ─── Initial map ──────────────────────────────────────────────────────────────
function initStartingState() {
  _place('blue',   10, 20, T.BLUE_HQ,   false); units.registerHQ('blue',   10, 20);
  _place('blue',   10, 60, T.BLUE_HQ,   false); units.registerHQ('blue',   10, 60);
  blueEcon.hqCount = 2;
  _place('yellow', 70, 20, T.YELLOW_HQ, false); units.registerHQ('yellow', 70, 20);
  _place('yellow', 70, 60, T.YELLOW_HQ, false); units.registerHQ('yellow', 70, 60);
  yellowEcon.hqCount = 2;

  // Blue road grid: vertical spine + horizontal streets
  for (let z = 2; z < GRID_SIZE - 2; z++) grid.set(2,  z, T.ROAD);
  for (let z = 2; z < GRID_SIZE - 2; z++) grid.set(15, z, T.ROAD);
  for (let z = 2; z < GRID_SIZE - 2; z++) grid.set(28, z, T.ROAD);
  for (let x = 2; x <= BLUE_X_END;   x++) grid.set(x, 15, T.ROAD);
  for (let x = 2; x <= BLUE_X_END;   x++) grid.set(x, 30, T.ROAD);
  for (let x = 2; x <= BLUE_X_END;   x++) grid.set(x, 50, T.ROAD);
  for (let x = 2; x <= BLUE_X_END;   x++) grid.set(x, 65, T.ROAD);

  // Yellow road grid: vertical spine + horizontal streets
  for (let z = 2; z < GRID_SIZE - 2; z++) grid.set(YELLOW_X_START + 2, z, T.ROAD);
  for (let z = 2; z < GRID_SIZE - 2; z++) grid.set(YELLOW_X_START + 15, z, T.ROAD);
  for (let z = 2; z < GRID_SIZE - 2; z++) grid.set(YELLOW_X_START + 28, z, T.ROAD);
  for (let x = YELLOW_X_START; x <= YELLOW_X_END - 2; x++) grid.set(x, 15, T.ROAD);
  for (let x = YELLOW_X_START; x <= YELLOW_X_END - 2; x++) grid.set(x, 30, T.ROAD);
  for (let x = YELLOW_X_START; x <= YELLOW_X_END - 2; x++) grid.set(x, 50, T.ROAD);
  for (let x = YELLOW_X_START; x <= YELLOW_X_END - 2; x++) grid.set(x, 65, T.ROAD);

  renderer.markDirty();
}

function _place(faction, x, z, type, register = true) {
  grid.set(x, z, type);
  const econ = faction === 'blue' ? blueEcon : yellowEcon;
  econ.addStructure(type);
  if (register && (type === T.BLUE_HQ || type === T.YELLOW_HQ)) units.registerHQ(faction, x, z);
}

// ─── Zone development tick ────────────────────────────────────────────────────
// ─── RCI demand model (Cities: Skylines style) ────────────────────────────────
// Demand is computed per faction from the balance of developed zones.
const demand = {
  blue:   { r: 0.5, c: 0.3, i: 0.4 },
  yellow: { r: 0.5, c: 0.3, i: 0.4 },
};

function countZones(faction) {
  const lo = faction === 'blue' ? 1 : YELLOW_X_START;
  const hi = faction === 'blue' ? BLUE_X_END : YELLOW_X_END - 1;
  let r = 0, c = 0, i = 0, rCap = 0, cCap = 0, iCap = 0;
  for (let x = lo; x <= hi; x++) {
    for (let z = 1; z < GRID_SIZE - 1; z++) {
      const t = grid.data[x][z];
      const lvl = grid.meta[x][z].zoneLevel ?? 0;
      if (t === T.ZONE_RES) { rCap++; r += lvl; }
      else if (t === T.ZONE_COM) { cCap++; c += lvl; }
      else if (t === T.ZONE_IND) { iCap++; i += lvl; }
    }
  }
  return { r, c, i, rCap, cCap, iCap };
}

function updateDemand(faction) {
  const d = demand[faction];
  const z = countZones(faction);
  // Developed "slots" of each type
  const homes = z.r;            // residential capacity in use
  const jobs  = z.i + z.c;      // industry + commercial provide jobs
  const shops = z.c;

  // Baseline demand keeps a young city growing even before anything is built.
  // Residential leads (people move in first), then jobs/shops follow population.
  let rd = 0.55 + (jobs - homes) * 0.04;
  let cd = 0.30 + (homes * 0.5 - shops) * 0.05;
  let id = 0.40 + (homes * 0.6 - z.i) * 0.05;

  // Oversupply damping: only when a LOT of developed capacity already sits idle
  // relative to the city's size (prevents runaway sprawl, not initial growth).
  // We compare developed levels, not raw painted tiles, so empty zoned land
  // never deadlocks its own development.
  const totalDev = homes + jobs + 1;
  if (z.r > totalDev * 0.6) rd -= 0.25;   // already mostly residential
  if (z.c > totalDev * 0.4) cd -= 0.25;
  if (z.i > totalDev * 0.4) id -= 0.25;

  // Smoothly approach targets
  d.r += (clamp01(rd) - d.r) * 0.1;
  d.c += (clamp01(cd) - d.c) * 0.1;
  d.i += (clamp01(id) - d.i) * 0.1;
}
function clamp01(v) { return Math.max(0, Math.min(1, v)); }

function tickZoneDevelopment(dt) {
  updateDemand('blue');
  updateDemand('yellow');

  let dirty = false;
  for (let x = 1; x <= GRID_SIZE-2; x++) {
    for (let z = 1; z <= GRID_SIZE-2; z++) {
      const t = grid.data[x][z];
      if (t !== T.ZONE_RES && t !== T.ZONE_COM && t !== T.ZONE_IND) continue;

      const m = grid.meta[x][z];
      if (!m.zoneLevel) m.zoneLevel = 0;
      if (m.zoneLevel >= 3) continue;

      const faction = x <= BLUE_X_END ? 'blue' : 'yellow';
      const econ = faction === 'blue' ? blueEcon : yellowEcon;
      // Needs adjacent road and power
      if (!econ.hasPower) continue;                 // faction must have generation capacity
      if (!grid.isPowered(x, z)) continue;          // and this tile must be connected to the grid
      if (!grid.hasAdjacentRoad(x, z)) continue;

      // Demand gate: only grow when there's demand for this zone type
      const d = demand[faction];
      const dem = t === T.ZONE_RES ? d.r : t === T.ZONE_COM ? d.c : d.i;
      if (dem < 0.1) continue;

      if (!m.devTimer) m.devTimer = 0;
      // Higher demand → faster development
      m.devTimer += dt * (0.5 + dem * 1.5);

      const needed = ZONE_DEVELOP_TIME[m.zoneLevel + 1];
      if (m.devTimer >= needed) {
        m.zoneLevel++;
        m.devTimer = 0;
        dirty = true;
      }
    }
  }
  if (dirty) renderer.markDirty();
}

// ─── Tool system ──────────────────────────────────────────────────────────────
window.setTool = (tool) => {
  activeTool = tool;
  document.querySelectorAll('.btn[data-tool]').forEach(b =>
    b.classList.toggle('active', b.dataset.tool === tool)
  );
};

window.buyWarTrain = () => {
  if (blueTrain.active) { logMsg('Train already deployed'); return; }
  if (blueEcon.structures.rail_station === 0) { logMsg('Need a Railway Station first'); return; }
  if (!blueEcon.spend(STRUCTURE_COSTS.war_train)) { logMsg('Need $100,000'); return; }
  blueTrain.active = true;
  logMsg('War Train deployed — now circling the map');
};

window.addTrainSlot = (type) => {
  if (!blueTrain.active) { logMsg('Deploy the War Train first'); return; }
  const cost = SLOT_COSTS[type];
  if (!blueEcon.spend(cost)) { logMsg(`Need $${cost.toLocaleString()}`); return; }
  if (!blueTrain.addSlot(type)) { logMsg('Train is full (4 slots max)'); return; }
  logMsg(`Added ${type} car`);
};

window.spawnBridgeTruck = (isRail) => {
  const key  = isRail ? 'rail_bridge_truck' : 'bridge_truck';
  const cost = STRUCTURE_COSTS[key];
  if (blueEcon.structures.bridge_depot === 0) { logMsg('Need a Bridge Depot first'); return; }
  if (!blueEcon.spend(cost)) { logMsg(`Need $${cost.toLocaleString()}`); return; }
  const t = bridgeTrucks.spawn('blue', 5, Math.floor(Math.random() * (GRID_SIZE-10))+5, isRail);
  if (isRail) {
    const broken = bridgeTrucks.findBrokenRail(grid);
    if (broken) t.setRailTarget(...broken);
  }
  logMsg(isRail ? 'Rail-Bridge Truck dispatched' : 'Bridge Truck dispatched');
};

// ─── Drag-paint click handling ────────────────────────────────────────────────
// Tools that support click-and-drag painting across many tiles.
const DRAG_TOOLS = new Set(['road','power_line','zone_res','zone_com','zone_ind','destroy_bridge','destroy_rail','bulldoze']);
let _painting   = false;
let _paintLast  = null;   // {x,z} last painted tile to avoid re-spamming
let _dragMoved  = false;

function _cellFromEvent(e) {
  const { x, z } = renderer.screenToWorld(e.clientX, e.clientY);
  if (x < 0 || x >= GRID_SIZE || z < 0 || z >= GRID_SIZE) return null;
  return { x, z };
}

canvas.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return;
  const c = _cellFromEvent(e);
  if (!c) return;
  // Only start a paint-drag for drag-capable tools; otherwise let OrbitControls handle it
  if (DRAG_TOOLS.has(activeTool)) {
    _painting  = true;
    _dragMoved = false;
    _paintLast = null;
    renderer.controls.enabled = false;      // don't rotate camera while painting
    handleClick(c.x, c.z);
    _paintLast = c;
    e.preventDefault();
  }
});

canvas.addEventListener('pointermove', (e) => {
  if (!_painting) return;
  const c = _cellFromEvent(e);
  if (!c) return;
  if (_paintLast && c.x === _paintLast.x && c.z === _paintLast.z) return;
  _dragMoved = true;
  // Interpolate a straight line between last and current cell so fast drags don't skip
  if (_paintLast) {
    for (const p of _lineCells(_paintLast.x, _paintLast.z, c.x, c.z)) handleClick(p.x, p.z);
  } else {
    handleClick(c.x, c.z);
  }
  _paintLast = c;
});

function _endPaint() {
  if (_painting) { _painting = false; renderer.controls.enabled = true; }
}
canvas.addEventListener('pointerup',     _endPaint);
canvas.addEventListener('pointerleave',  _endPaint);
window.addEventListener('pointerup',     _endPaint);

// Bresenham-ish line between two grid cells
function _lineCells(x0, z0, x1, z1) {
  const cells = [];
  const dx = Math.abs(x1 - x0), dz = Math.abs(z1 - z0);
  const sx = x0 < x1 ? 1 : -1, sz = z0 < z1 ? 1 : -1;
  let err = dx - dz, x = x0, z = z0;
  let guard = 0;
  while (guard++ < 400) {
    cells.push({ x, z });
    if (x === x1 && z === z1) break;
    const e2 = 2 * err;
    if (e2 > -dz) { err -= dz; x += sx; }
    if (e2 <  dx) { err += dx; z += sz; }
  }
  return cells;
}

// Single-click fallback for non-drag tools (placement buildings) + right-click pack-up
canvas.addEventListener('click', (e) => {
  if (_dragMoved) { _dragMoved = false; return; } // was a drag, already handled
  if (DRAG_TOOLS.has(activeTool)) return;          // drag tools handled on pointerdown
  const c = _cellFromEvent(e);
  if (!c) return;
  handleClick(c.x, c.z);
});

canvas.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  const { x, z } = renderer.screenToWorld(e.clientX, e.clientY);
  const truck = bridgeTrucks.getTruckNear(x, z);
  if (truck && truck.faction === 'blue' && truck.state === 'deployed') {
    truck.packUp(grid);
    logMsg('Bridge Truck packing up');
    renderer.markDirty();
    return;
  }
  // Right-click with a tool active → back to Select
  if (activeTool !== 'select') setTool('select');
});

window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && activeTool !== 'select') setTool('select');
});

function handleClick(x, z) {
  // Bulldoze tool — clear blue-territory tiles back to empty
  if (activeTool === 'bulldoze') {
    if (!grid.isBlueTerritory(x)) return;
    const t = grid.get(x, z);
    if (t === T.EMPTY || t === T.WATER) return;
    if (t === T.BLUE_HQ) { logMsg('Cannot bulldoze HQ'); return; }
    grid.set(x, z, T.EMPTY);
    grid.meta[x][z] = {};
    renderer.markDirty();
    return;
  }
  if (activeTool === 'destroy_bridge') {
    if (peacetime) { logMsg('Cannot destroy bridges during peace treaty'); return; }
    if (grid.get(x, z) === T.BRIDGE) { grid.destroyBridge(z); renderer.markDirty(); logMsg('Bridge destroyed'); }
    return;
  }
  if (activeTool === 'destroy_rail') {
    if (peacetime) { logMsg('Cannot sabotage rail during peace treaty'); return; }
    if (grid.isRailPerimeter(x, z) && !grid.isBlueTerritory(x)) {
      if (grid.destroyRail(x, z)) { renderer.markDirty(); logMsg('Rail sabotaged!'); }
    }
    return;
  }

  // Emergency bridge repair
  if (activeTool === 'road' && grid.isChasm(x) && grid.isBridgeLane(z) && grid.get(x, z) === T.BRIDGE_BROKEN) {
    if (blueEcon.spend(10)) { grid.repairBridge(z); renderer.markDirty(); logMsg('Bridge repaired — $10'); }
    return;
  }

  // Buy Land tool — purchase the parcel under the cursor
  if (activeTool === 'buy_land') {
    const p = grid.parcelOf(x, z);
    if (!p || p.faction !== 'blue') { logMsg('Can only buy land in Blue territory'); return; }
    if (grid.owned.blue.has(p.key)) { logMsg('You already own this parcel'); return; }
    const cost = Math.round(grid.parcelCost('blue'));
    if (!blueEcon.spend(cost)) { logMsg(`Need $${cost.toLocaleString()} for this parcel`); return; }
    grid.buyParcel('blue', p.col, p.row);
    renderer.markDirty();
    logMsg(`Bought parcel — $${cost.toLocaleString()}`);
    return;
  }

  if (activeTool === 'select') return;
  if (!grid.isBlueTerritory(x)) return;
  if (!grid.isOwned(x, z)) {
    if (!DRAG_TOOLS.has(activeTool)) logMsg('You don\'t own this land — use Buy Land');
    return;
  }

  const baseCost = STRUCTURE_COSTS[activeTool] ?? 0;
  const cost     = blueEcon.applyCost(activeTool, baseCost);
  if (!blueEcon.canAfford(cost)) { logMsg(`Need $${cost.toLocaleString()}`); return; }
  if (activeTool === 'hq' && blueEcon.hqCount >= MAX_HQS) { logMsg('Max 5 HQs'); return; }
  if (activeTool === 'water_pump' && x !== BLUE_X_END) { logMsg('Water pump must be at column 39'); return; }
  if (activeTool === 'sewage' && x < 15) { blueEcon.waterContaminated = true; logMsg('⚠ Sewage near water pump — contaminated!'); }

  const existing = grid.get(x, z);
  if (existing !== T.EMPTY) {
    if (!DRAG_TOOLS.has(activeTool)) logMsg('Tile occupied');
    return;
  }

  const typeMap = {
    road: T.ROAD, power_line: T.POWER_LINE, hq: T.BLUE_HQ, barracks: T.BLUE_BARRACKS,
    coal_power: T.BLUE_COAL_POWER, wind_power: T.BLUE_WIND,
    water_pump: T.BLUE_WATER_PUMP, sewage: T.BLUE_SEWAGE,
    landfill: T.BLUE_LANDFILL, incinerator: T.BLUE_INCINERATOR,
    coal_mine: T.BLUE_COAL_MINE, iron_refinery: T.BLUE_IRON,
    gold_mine: T.BLUE_GOLD, bridge_truck_depot: T.BLUE_BRIDGE_DEPOT,
    railway_station: T.BLUE_RAIL_STATION,
    hospital: T.BLUE_HOSPITAL, police: T.BLUE_POLICE, fire: T.BLUE_FIRE, park: T.BLUE_PARK,
    zone_res: T.ZONE_RES, zone_com: T.ZONE_COM, zone_ind: T.ZONE_IND,
  };
  const type = typeMap[activeTool];
  if (!type) return;

  blueEcon.spend(cost);
  grid.set(x, z, type);

  // Init zone metadata
  if (type === T.ZONE_RES || type === T.ZONE_COM || type === T.ZONE_IND) {
    grid.meta[x][z] = { zoneLevel: 0, devTimer: 0 };
  }

  blueEcon.addStructure(type);
  if (type === T.BLUE_HQ)       units.registerHQ('blue', x, z);
  if (type === T.BLUE_BARRACKS) units.registerBarracks('blue', x, z);

  renderer.markDirty();
  if (!DRAG_TOOLS.has(activeTool)) {
    logMsg(`Built ${activeTool} — $${cost.toLocaleString()}`);
    setTool('select'); // one-shot buildings deselect after placing
  }
}

// ─── Barracks spawning ────────────────────────────────────────────────────────
function tickBarracks(dt) {
  if (peacetime) return;
  barracksTimer += dt;
  if (barracksTimer < BARRACKS_INTERVAL) return;
  barracksTimer = 0;
  const positions = units.blueBarracksPos;
  for (let i = 0; i < blueEcon.structures.barracks; i++) {
    if (blueEcon.spend(BARRACKS_COST)) {
      const p = positions[i] ?? { x: 5, z: Math.floor(Math.random()*(GRID_SIZE-10))+5 };
      units.spawnUnit('blue', p.x, p.z);
    }
  }
}

// ─── Train events ─────────────────────────────────────────────────────────────
function processTrainEvents(events) {
  for (const ev of events) {
    if (ev.type === 'derail') {
      renderer.addExplosion(ev.x, ev.z, ev.radius);
      logMsg('TRAIN DERAILED — CATASTROPHIC EXPLOSION!');
      const ir = Math.ceil(ev.radius);
      const ix = Math.round(ev.x), iz = Math.round(ev.z);
      for (let dx = -ir; dx <= ir; dx++) {
        for (let dz = -ir; dz <= ir; dz++) {
          if (Math.hypot(dx, dz) > ev.radius) continue;
          const t = grid.get(ix+dx, iz+dz);
          if (t === T.RAIL) grid.set(ix+dx, iz+dz, T.RAIL_BROKEN);
          if (t >= 10)      grid.set(ix+dx, iz+dz, T.EMPTY);
        }
      }
      for (const u of [...units.blueUnits, ...units.yellowUnits]) {
        if (Math.hypot(u.x - ev.x, u.z - ev.z) < ev.radius) u.dead = true;
      }
      renderer.markDirty();
    }
    if (ev.type === 'spawn_unit') units.spawnUnit(ev.faction, ev.x, ev.z);
  }
}

function tickAITrain(dt) {
  if (!aiTrainDeployed && yellowEcon.structures.rail_station > 0 && yellowEcon.canAfford(STRUCTURE_COSTS.war_train)) {
    yellowEcon.spend(STRUCTURE_COSTS.war_train);
    yellowTrain.active = true;
    yellowTrain.addSlot('anti_infantry');
    aiTrainDeployed = true;
    logMsg('Yellow deployed a War Train!');
  }
  if (yellowTrain.active && !yellowTrain.derailed) {
    processTrainEvents(yellowTrain.tick(dt, grid, units));
  }
}

function tickAIBridgeTrucks(dt) {
  if (peacetime || ai.personality !== 'flanker') return;
  aiTruckTimer += dt;
  if (aiTruckTimer < 30) return;
  aiTruckTimer = 0;
  if (yellowEcon.spend(STRUCTURE_COSTS.bridge_truck)) {
    bridgeTrucks.spawn('yellow', 75, Math.floor(Math.random()*(GRID_SIZE-10))+5, false);
  }
}

// ─── AI zone building ─────────────────────────────────────────────────────────
let aiZoneTimer = 0;
function tickAIZones(dt) {
  aiZoneTimer += dt;
  if (aiZoneTimer < 5) return;
  aiZoneTimer = 0;
  // AI places residential and commercial zones during the truce
  if (!peacetime) return;
  if (!yellowEcon.canAfford(STRUCTURE_COSTS.zone_res)) return;
  const x = YELLOW_X_START + Math.floor(Math.random() * 30) + 2;
  const z = Math.floor(Math.random() * (GRID_SIZE - 10)) + 5;
  if (grid.get(x, z) === T.EMPTY) {
    const type = Math.random() < 0.7 ? T.ZONE_RES : T.ZONE_COM;
    yellowEcon.spend(STRUCTURE_COSTS.zone_res);
    grid.set(x, z, type);
    grid.meta[x][z] = { zoneLevel: 0, devTimer: 0 };

    // Ensure adjacent road so zone can develop
    const dirs = [[0,-1],[0,1],[-1,0],[1,0]];
    let hasRoad = dirs.some(([dx,dz]) => {
      const t = grid.get(x+dx, z+dz);
      return t === T.ROAD || t === T.BRIDGE;
    });
    if (!hasRoad) {
      const [dx, dz] = dirs[Math.floor(Math.random() * 4)];
      const rx = x + dx, rz = z + dz;
      if (grid.get(rx, rz) === T.EMPTY) grid.set(rx, rz, T.ROAD);
    }
    renderer.markDirty();
  }
}

// ─── UI ───────────────────────────────────────────────────────────────────────
function logMsg(msg) {
  const el = document.getElementById('message-log');
  const div = document.createElement('div');
  div.className = 'msg';
  div.textContent = msg;
  el.appendChild(div);
  setTimeout(() => div.remove(), 4000);
}

function fmt(n) { return Math.floor(n).toLocaleString(); }

function updateUI() {
  document.getElementById('blue-cash').textContent    = fmt(blueEcon.cash);
  document.getElementById('blue-hqs').textContent     = blueEcon.hqCount;
  document.getElementById('blue-pop').textContent     = fmt(blueEcon.population);
  document.getElementById('blue-income').textContent  = fmt(blueEcon.incomePerSec);

  // RCI demand bars
  const bd = demand.blue;
  document.getElementById('blue-rci-r').style.width = Math.round(bd.r * 100) + '%';
  document.getElementById('blue-rci-c').style.width = Math.round(bd.c * 100) + '%';
  document.getElementById('blue-rci-i').style.width = Math.round(bd.i * 100) + '%';

  document.getElementById('yellow-cash').textContent   = fmt(yellowEcon.cash);
  document.getElementById('yellow-hqs').textContent    = yellowEcon.hqCount;
  document.getElementById('yellow-pop').textContent    = fmt(yellowEcon.population);
  document.getElementById('yellow-income').textContent = fmt(yellowEcon.incomePerSec);

  const rem  = Math.max(0, PEACE_DURATION - elapsedSec);
  const el   = document.getElementById('timer');
  el.textContent = `${Math.floor(rem/60)}:${String(Math.floor(rem%60)).padStart(2,'0')}`;
  el.className   = peacetime ? 'peace' : 'war';
  document.getElementById('peace-label').textContent = peacetime ? 'PEACE TREATY' : 'WAR';

  const lEl = document.getElementById('node-left'),  rEl = document.getElementById('node-right');
  if (lEl) lEl.textContent = `◈ Left: ${edgeNodes.leftNode.owner.toUpperCase()} (${edgeNodes.leftNode.buff.replace('_',' ')})`;
  if (rEl) rEl.textContent = `◈ Right: ${edgeNodes.rightNode.owner.toUpperCase()} (${edgeNodes.rightNode.buff.replace('_',' ')})`;
  const pw = document.getElementById('plague-warn');
  if (pw) pw.style.display = blueEcon.plagueActive ? 'block' : 'none';

  blueEcon.tradePortMult   = edgeNodes.tradePortMult('blue');
  yellowEcon.tradePortMult = edgeNodes.tradePortMult('yellow');
}

function checkWin() {
  if (peacetime) return;
  if (units.blueHQs.length   === 0) logMsg('YELLOW WINS — All Blue HQs destroyed!');
  if (units.yellowHQs.length === 0) logMsg('BLUE WINS — All Yellow HQs destroyed!');
}

// ─── Game loop ────────────────────────────────────────────────────────────────
// ─── Power network recompute (throttled) ──────────────────────────────────────
let _powerTimer = 0;
function tickPower(dt) {
  _powerTimer += dt;
  if (_powerTimer < 0.5) return;
  _powerTimer = 0;
  grid.computePower();
}

function loop(ts) {
  const dt = lastTime === null ? 0 : Math.min((ts - lastTime) / 1000, 0.1);
  lastTime = ts;
  elapsedSec += dt;
  peacetime = elapsedSec < PEACE_DURATION;

  blueEcon.tick(dt);
  yellowEcon.tick(dt);
  tickPower(dt);
  blueTraffic.tick(dt);
  yellowTraffic.tick(dt);
  blueWaste.tick(dt);
  yellowWaste.tick(dt);
  blueFreight.tick(dt);
  yellowFreight.tick(dt);
  edgeNodes.tick(dt, units.blueUnits, units.yellowUnits);
  ai.tick(dt, peacetime, elapsedSec);
  if (ai._aiDirty) { renderer.markDirty(); ai._aiDirty = false; }
  units.tick(dt, grid);
  tickBarracks(dt);
  tickZoneDevelopment(dt);
  tickAIZones(dt);
  bridgeTrucks.tick(dt, grid);
  tickAIBridgeTrucks(dt);

  if (blueTrain.active   && !blueTrain.derailed)   processTrainEvents(blueTrain.tick(dt, grid, units));
  tickAITrain(dt);

  renderer.render(
    dt, units, { blueTraffic, yellowTraffic },
    bridgeTrucks, [blueTrain, yellowTrain],
    edgeNodes, blueFreight, yellowFreight, blueWaste, yellowWaste
  );
  updateUI();
  checkWin();
  requestAnimationFrame(loop);
}

initStartingState();
grid.computePower();
requestAnimationFrame(loop);

</script>
